name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Publish @uaif/core
        run: pnpm --filter @uaif/core publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @uaif/cli
        run: pnpm --filter @uaif/cli publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish adapters
        run: |
          pnpm --filter @uaif/adapter-react publish --access public
          pnpm --filter @uaif/adapter-next publish --access public
          pnpm --filter @uaif/adapter-expo publish --access public
          pnpm --filter @uaif/clerk publish --access public
          pnpm --filter @uaif/firebase-auth publish --access public
          pnpm --filter @uaif/mongodb publish --access public
          pnpm --filter @uaif/cloudinary publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
