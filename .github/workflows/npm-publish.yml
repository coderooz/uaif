name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0)'
        required: true
        type: string
      confirm:
        description: 'Type PUBLISH to confirm'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    if: inputs.confirm == 'PUBLISH' || github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Publish @uaif/core
        run: pnpm --filter @uaif/core publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @uaif/cli
        run: pnpm --filter @uaif/cli publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish adapters
        run: |
          pnpm --filter @uaif/adapter-react publish --access public --no-git-checks
          pnpm --filter @uaif/adapter-next publish --access public --no-git-checks
          pnpm --filter @uaif/adapter-expo publish --access public --no-git-checks
          pnpm --filter @uaif/adapter-clerk publish --access public --no-git-checks
          pnpm --filter @uaif/adapter-firebase-auth publish --access public --no-git-checks
          pnpm --filter @uaif/adapter-mongodb publish --access public --no-git-checks
          pnpm --filter @uaif/adapter-cloudinary publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Post-publish verification
        run: |
          echo "Waiting for npm propagation..."
          sleep 60

          echo "Verifying packages..."
          npm view @uaif/core version || echo "⚠️  @uaif/core not yet available"
          npm view @uaif/cli version || echo "⚠️  @uaif/cli not yet available"
          npm view @uaif/adapter-clerk version || echo "⚠️  @uaif/adapter-clerk not yet available"
