name: Auto Tag

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to create'
        required: true
        type: string
      message:
        description: 'Tag message'
        required: false
        type: string
        default: 'Release'

permissions:
  contents: write

jobs:
  tag:
    name: Create Git Tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create tag from release
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
            MESSAGE="Release $TAG_NAME"
          else
            TAG_NAME="${{ inputs.tag }}"
            MESSAGE="${{ inputs.message }}"
          fi

          if [ -z "$TAG_NAME" ]; then
            echo "No tag name found"
            exit 1
          fi

          echo "Creating tag: $TAG_NAME"
          git tag -a "$TAG_NAME" -m "$MESSAGE" || echo "Tag $TAG_NAME already exists"
          git push origin "$TAG_NAME" || echo "Tag already pushed"
          echo "✅ Tag $TAG_NAME created"
